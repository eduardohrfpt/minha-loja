<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>HRKeys — Assinaturas premium, preço justo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--Start of Tawk.to Script-->
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {},
        Tawk_LoadStart = new Date();
      // Tenta forçar pt-BR independente do idioma do navegador do visitante. `locale` não é
      // um método documentado na API oficial do Tawk (https://developer.tawk.to/jsapi/) --
      // setamos antes do script carregar e de novo dentro do onLoad (ver abaixo) porque isso
      // é o que muda o idioma dos textos auto-gerados pelo próprio Tawk (ex: título da aba
      // "X nova(s) mensagem(ns)"). Mas o conteúdo do widget em si (saudação, botões de
      // resposta rápida, placeholder do campo de texto, "Powered by tawk.to") continua vindo
      // em inglês -- isso só se resolve configurando o idioma padrão do widget no painel:
      // Administration > Chat Widget > Widget Content > Language.
      Tawk_API.locale = "pt-BR";
      // Widget escondido por padrão em todo o site -- só aparece quando o próprio código
      // da aplicação chama Tawk_API.showWidget() (ex: botão de suporte em "Minhas compras").
      Tawk_API.onLoad = function () {
        Tawk_API.locale = "pt-BR";
        Tawk_API.hideWidget();
      };
      // O Tawk troca o título da aba (ex: "1 nova mensagem") e o favicon quando chega
      // mensagem não lida, mesmo com o widget escondido. Não existe um método na API JS pra
      // desligar isso -- o único jeito documentado é a opção "Disable browser tab
      // notification" no painel (Administration > Chat Widget > Widget Behavior >
      // Notification settings), e relatos da comunidade do Tawk dizem que ela nem sempre
      // cobre 100% dos casos. Por segurança, guardamos o título/favicon originais aqui (antes
      // do script do Tawk sequer carregar) e um MutationObserver devolve qualquer alteração
      // que apareça neles, venha do Tawk ou de outra coisa.
      (function () {
        var tituloOriginal = document.title;
        var elementoTitulo = document.querySelector("title");
        if (elementoTitulo) {
          new MutationObserver(function () {
            if (document.title !== tituloOriginal) document.title = tituloOriginal;
          }).observe(elementoTitulo, { childList: true, characterData: true, subtree: true });
        }

        var linkFavicon = document.querySelector('link[rel~="icon"]');
        if (linkFavicon) {
          var hrefFaviconOriginal = linkFavicon.getAttribute("href");
          new MutationObserver(function () {
            if (linkFavicon.getAttribute("href") !== hrefFaviconOriginal) {
              linkFavicon.setAttribute("href", hrefFaviconOriginal);
            }
          }).observe(linkFavicon, { attributes: true, attributeFilter: ["href"] });
        }

        // Em vez de alterar o <link> existente, o Tawk pode inserir um novo -- remove
        // qualquer link de ícone extra que não seja o nosso.
        new MutationObserver(function (mutacoes) {
          mutacoes.forEach(function (mutacao) {
            mutacao.addedNodes.forEach(function (node) {
              if (
                node.nodeType === 1 &&
                node.tagName === "LINK" &&
                /icon/i.test(node.getAttribute("rel") || "") &&
                node !== linkFavicon
              ) {
                node.remove();
              }
            });
          });
        }).observe(document.head, { childList: true });
      })();
      (function () {
        var s1 = document.createElement("script"),
          s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = "https://embed.tawk.to/6aa2e3cc1e12513447b80143/1k264jm2v";
        s1.charset = "UTF-8";
        s1.setAttribute("crossorigin", "*");
        s0.parentNode.insertBefore(s1, s0);
      })();
    </script>
    <!--End of Tawk.to Script-->
  </body>
</html>
